      has_wb_digital: {description: join กับ wb_digital ติดหรือไม่}
      has_wb_governance: {description: join กับ wb_governance ติดหรือไม่}
      has_vdem: {description: join กับ vdem_country_year ติดหรือไม่}
      has_bgp: {description: join กับ bgp_country_year ติดหรือไม่}
      has_gci: {description: มีค่า GCI (as-of) หรือไม่}
      has_population: {description: มีข้อมูลประชากรหรือไม่ (ใช้คัดดินแดนที่ไม่มีคนอยู่ออก)}
